[tools]
go = "1.26.5"
"go:github.com/gohugoio/gotmplfmt" = "0.4.1"
goreleaser = "2.17.0"
rumdl = "0.2.38"
shfmt = "3.13.1"
svu = "3.4.1"
taplo = "0.10.0"

[tasks.build]
description = "Build the autofeat CLI"
run = "bash ./scripts/build.sh"

[tasks.test]
description = "Run the test suite"
run = "go test -v ./..."

[tasks.test-integration]
description = "Run the compiled CLI integration tests"
run = "go test -v ./integration"

[tasks.test-install]
description = "Run all installer integration tests"
run = """
bash ./scripts/install-linux.test.sh
bash ./scripts/install-from-sources-linux.test.sh
if command -v pwsh >/dev/null 2>&1; then
	pwsh -NoProfile -File ./scripts/install-win.test.ps1
elif command -v powershell.exe >/dev/null 2>&1; then
	powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$(wslpath -w "$PWD/scripts/install-win.test.ps1")"
else
	echo "PowerShell is required to run install-win.test.ps1." >&2
	exit 1
fi
"""

[tasks.format]
description = "Format all supported repository files"
run = "bash ./scripts/format.sh"

[tasks.release]
description = "Create, verify, and publish a release"
run = "bash ./scripts/release.sh"

[tasks.release-check]
description = "Build release archives locally without publishing"
run = """
export GOVERSION="$(go env GOVERSION)"
goreleaser check
goreleaser release --snapshot --clean --skip=publish
"""

[tasks.setup-hooks]
description = "Configure Git to use the repository hooks"
run = "git config --local core.hooksPath .githooks"

[tasks.run]
description = "Build and run the autofeat CLI (lists sessions by default)"
depends = ["build"]
run = "bash ./scripts/run.sh"

[tasks.clean]
description = "Remove build artifacts"
run = "rm -rf bin"

[tasks.debug]
description = "Display the autofeat config and state"
run = "bash ./scripts/debug.sh"

[tasks.install]
description = "Install the CLI and add it to PATH"
run = "bash ./scripts/install-from-sources-linux.sh"

[tasks.uninstall]
description = "Remove the installed CLI and PATH entry"
run = "bash ./scripts/uninstall.sh"
