[global]
respect-gitignore = true
exclude = [".github/**"]

[MD003]
style = "atx" # Heading style (atx, atx_closed, setext)

[MD004]
style = "asterisk" # Unordered list style (asterisk, plus, dash, consistent)

[MD007]
indent = 4 # Unordered list indentation

[MD022]
lines-above = 1 # Require a blank line before headings
lines-below = 0 # Do not require a blank line after headings

[MD032]
enabled = false # Allow lists directly after headings

[MD012]
maximum = 1 # Allow at most one consecutive blank line

[MD013]
line-length = 120   # Line length
code-blocks = false # Exclude code blocks from line length check
tables = false      # Exclude tables from line length check
headings = true     # Include headings in line length check
reflow = true       # Wrap long prose lines automatically

[MD036]
fix = true # Convert emphasis-only section labels to headings

[MD044]
# Proper names that should be capitalized correctly
names = ["rumdl", "Markdown", "GitHub"]
code-blocks = false                     # Check code blocks for proper names (default: false, skips code blocks)
